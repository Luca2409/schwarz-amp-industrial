name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for the sitemap's lastmod dates (src/lib/last-modified.ts).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Set the repository variable PROTOTYPE to "true" (Settings → Secrets and variables →
      # Actions → Variables) to deploy a prototype: placeholders only warn, site is noindex.
      - name: Build Astro
        run: npm run build
        env:
          PUBLIC_PROTOTYPE: ${{ vars.PROTOTYPE }}

      # Uses the runner's preinstalled Google Chrome and builds into dist-e2e/, not dist/.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4